s the author's work, from the findings.\n\n**Copy written for people.** Interface text, documentation and messages a person reads are not instructions to a model.\n", "lines": 72}, {"id": "reviewing-python", "group": "Linguagens", "name": "reviewing-python", "source": "engineering/python/skills/reviewing-python/SKILL.md", "when": "Rota python.", "description": "Use when a change under review edits Python (.py or .pyi) and the question is what a Python reader would catch that a language-agnostic pass does not - a mutable default argument, a swallowed exception, a late-binding closure, an unannotated surface, a type hole mypy would reject. Reads the routed files against this plugin's Python rules and the conditions below; every finding names the condition.", "text": "# Reviewing Python\n\nThe language-agnostic pass in `ahrena-engineering-quality:skills/reviewing-diffs/SKILL.md` has already read the change against the rules that hold in any language, and `hooks/check-structure.py` has decided the mechanical conditions over the changed Python. This skill reads what is left: the defects that need a Python reader.\n\nThe conditions are checklists in `references/`, identified by a prefix and a number. A finding cites the identifier. Severity and route follow `ahrena-engineering-quality:docs/review-findings.md`.\n\n## 1. Take the route, and read the repository first\n\nThe router fired the `python` route on the changed `.py` and `.pyi` files. Those are the files this skill reads.\n\nBefore the checklists, read how this repository writes Python: its `pyproject.toml` for the Python version and the type-checker and linter configuration, its `AGENTS.md` and `CLAUDE.md`, and the layering its own `rules/module-boundaries.md` describes. A condition the project's own configuration already decides — a linter that bans bare `except`, a formatter that fixes a style — is not reported again. What a green check decided is settled.\n\n## 2. Open the checklists the change calls for\n\n| What the change touches | Reference |\n|---|---|\n| any Python file | `references/correctness.md`, the conditions that hold for every change |\n| a function signature, an annotation, a dataclass, a public callable | `references/types-and-contracts.md`, with `rules/typing.md` |\n| an import, a package boundary, a module's public surface, an `__init__.py` | `references/idioms-and-structure.md`, with `rules/module-boundaries.md` |\n\nA change that only edits a string or a comment inside one function opens `correctness.md` alone.\n\n## 3. Read beyond the hunk\n\nFor each symbol the change touches, open the whole file and the callers the diff does not show. A mutable default is decided at the `def`, but whether it bites is decided where the function is called twice. An annotation is judged against what the function returns on every path, not only the edited one.\n\nRead what the change replaced, from the base revision, before calling a changed line wrong.\n\n## 4. Apply the routed conditions\n\nWork condition by condition. For each candidate, give the scenario in Python terms: the input or the state, the value or the exception that results, and what it should have been. A condition whose answer depends on the project's intent, and which the repository does not settle, is a `question`.\n\nRead each condition's `Exempt` line and drop what it excludes. Python has an idiom for nearly every one of these conditions that is correct on purpose.\n\n## 5. Write the findings\n\nEach finding carries the four fields in `ahrena-engineering-quality:docs/review-findings.md`, with the condition identifier where the rule and condition number go, and a correction that is an instruction: the line, what to replace, and with what.\n\nHand the set back to step 7 of `ahrena-engineering-quality:skills/reviewing-diffs/SKILL.md`. Do not publish from here, and do not edit the change.\n\n## When this skill does not apply\n\n**A language-agnostic defect.** Nesting depth, a function too long, a duplicated block, an abstraction with one consumer: those are `reviewing-diffs` and the fundamentals rules, and `hooks/check-structure.py` already decided the ones it can.\n\n**The import graph of a distribution.** Whether a package's layers depend only downward and the graph is acyclic is `rules/module-boundaries.md` and its own hook, not a reading.\n\n**Security of a Python change.** Untrusted input reaching a query or a command, a secret, a call to a model: that is the security disciplines (`reviewing-untrusted-input`, `reviewing-secrets`, `reviewing-sensitive-data`, `reviewing-model-use`), whose conditions carry those sinks.\n\n**Another language.** A `.ts`, `.go` or `.rs` file in the same change is read by that language's skill.\n", "lines": 50}, {"id": "reviewing-typescript", "group": "Linguagens", "name": "reviewing-typescript", "source": "engineering/typescript/skills/reviewing-typescript/SKILL.md", "when": "Rota typescript.", "description": "Use when a change under review edits TypeScript or JavaScript (.ts, .tsx, .js, .jsx and their module variants) and the question is what a TypeScript reader would catch - an any or a cast that reopens a hole the compiler would have closed, a floating or unhandled promise, == where === was meant, a widened public type. Reads the routed files against the conditions below; every finding names the condition.", "text": "# Reviewing TypeScript\n\nThe language-agnostic pass in `ahrena-engineering-quality:skills/reviewing-diffs/SKILL.md` has read the change against the rules that hold in any language. This skill reads what needs a TypeScript reader: the places the type system was told to stop checking, the async mistakes, and the surface others compile against.\n\nThe conditions are checklists in `references/`, identified by a prefix and a number. A finding cites the identifier. Severity and route follow `ahrena-engineering-quality:docs/review-findings.md`.\n\n## 1. Take the route, and read the repository first\n\nThe router fired the `typescript` route on the changed `.ts`, `.tsx`, `.js` and `.jsx` files (and the `.mts`/`.cts`/`.mjs`/`.cjs` variants). Those are the files this skill reads.\n\nRead the project's `tsconfig.json` first: `strict`, `noUncheckedIndexedAccess`, `exactOptionalPropertyTypes`, `noImplicitAny` decide which of these conditions the compiler already catches. In a strict project, a hole only exists where the code reopens it (`any`, `as`, `!`, `@ts-ignore`); in a loose one, the reader carries more. Read the ESLint config too — a rule it enforces (`no-floating-promises`, `eqeqeq`) is settled, and not reported again. A green `tsc` and a green lint decide what they cover.\n\n## 2. Open the checklists the change calls for\n\n| What the change touches | Reference |\n|---|---|\n| a type, an interface, a cast, a generic, a signature | `references/types.md` |\n| a promise, `async`/`await`, an event handler, equality, a number | `references/correctness-and-async.md` |\n| an export, a barrel, a public declaration, a `.d.ts` | `references/modules-and-surface.md` |\n\nA change to a component's internals that adds no type and no async opens `correctness-and-async.md` alone.\n\n## 3. Read beyond the hunk\n\nFollow each changed symbol to its callers and to the types it flows into. A cast is judged by what the value actually is at runtime, which the surrounding code shows, not by the hunk. An exported type is judged by who imports it.\n\nRead what the change replaced, from the base revision, before calling a changed line wrong.\n\n## 4. Apply the routed conditions\n\nWork condition by condition. Give the scenario in TypeScript terms: the value at runtime, the type the compiler believed, and where they part. A condition whose answer is a project convention the repository does not state is a `question`.\n\nRead each condition's `Exempt` line. A cast at a true boundary and an `any` on genuinely dynamic data are correct, and reporting them teaches the author to skim.\n\n## 5. Write the findings\n\nEach finding carries the four fields in `ahrena-engineering-quality:docs/review-findings.md`, with the condition identifier and a correction that is an instruction.\n\nHand the set back to step 7 of `ahrena-engineering-quality:skills/reviewing-diffs/SKILL.md`. Do not publish from here, and do not edit the change.\n\n## When this skill does not apply\n\n**A language-agnostic defect.** Length, nesting, duplication, a premature abstraction: those are `reviewing-diffs` and the fundamentals rules.\n\n**The experience of a React or browser UI.** Accessibility, component and state architecture, rendering performance and design-system use are a front-end discipline, not this skill, which reads the language. When the framework ships that discipline it owns them; until then this skill stays inside the type system, async and the module surface.\n\n**Security of the change.** XSS through `dangerouslySetInnerHTML`, a URL built from input, a secret in a bundle: that is the security disciplines (`reviewing-untrusted-input`, `reviewing-secrets`, `reviewing-sensitive-data`, `reviewing-model-use`), whose conditions carry those sinks.\n\n**Another language.** A `.py`, `.go` or `.rs` file in the same change is read by that language's skill.\n", "lines": 50}, {"id": "reviewing-go", "group": "Linguagens", "name": "reviewing-go", "source": "engineering/go/skills/reviewing-go/SKILL.md", "when": "Rota go.", "description": "Use when a change under review edits Go (.go) and the question is what a Go reader would catch - an error ignored or wrapped so callers can no longer match it, a goroutine or context that leaks, a nil interface that is not nil, a loop variable captured, a defer that never runs. Reads the routed files against the conditions below; every finding names the condition.", "text": "# Reviewing Go\n\nThe language-agnostic pass in `ahrena-engineering-quality:skills/reviewing-diffs/SKILL.md` has read the change against the rules that hold in any language. This skill reads what needs a Go reader: errors, concurrency, and the handful of traps the compiler and `go vet` do not all catch.\n\nThe conditions are checklists in `references/`, identified by a prefix and a number. A finding cites the identifier. Severity and route follow `ahrena-engineering-quality:docs/review-findings.md`.\n\n## 1. Take the route, and read the repository first\n\nThe router fired the `go` route on the changed `.go` files. Those are the files this skill reads.\n\nRead the project's Go version from `go.mod` first: it decides real conditions — before 1.22 each loop iteration shared one variable, and the error-wrapping verbs and `errors.Join` arrived over several versions. Read `AGENTS.md` and whether the project runs `go vet`, `staticcheck` or `golangci-lint` in CI: a check those already decide — an unchecked error that `errcheck` flags, a lost `Context` that `contextcheck` flags — is settled and not reported again.\n\n## 2. Open the checklists the change calls for\n\n| What the change touches | Reference |\n|---|---|\n| a returned `error`, an `error` value, a `panic`/`recover`, a deferred close | `references/errors.md` |\n| a `go` statement, a channel, a `sync` primitive, a `context.Context`, a shared variable | `references/concurrency.md` |\n| an interface, a `nil` comparison, a `defer`, an exported identifier, a slice or map aliased | `references/idioms-and-surface.md` |\n\nA change that only edits a pure function's arithmetic opens none of these; say the Go pass found nothing specific.\n\n## 3. Read beyond the hunk\n\nFollow each changed function to its callers and to what it returns. Whether a returned error is checked is decided at the call site, not the `return`. Whether a goroutine leaks is decided where the function that starts it returns. Read the base revision of a line before calling it wrong.\n\n## 4. Apply the routed conditions\n\nWork condition by condition. Give the scenario in Go terms: the value, the error, the goroutine state, and what it should have been. A condition whose answer depends on the project's intent, unstated, is a `question`.\n\nRead each condition's `Exempt` line. Go has a correct idiom for nearly every one of these — a deliberately ignored error, a goroutine the program is meant to outlive — and reporting those costs the reviewer's credit.\n\n## 5. Write the findings\n\nEach finding carries the four fields in `ahrena-engineering-quality:docs/review-findings.md`, with the condition identifier and a correction that is an instruction.\n\nHand the set back to step 7 of `ahrena-engineering-quality:skills/reviewing-diffs/SKILL.md`. Do not publish from here, and do not edit the change.\n\n## When this skill does not apply\n\n**A language-agnostic defect.** Function length, nesting, duplication, a premature interface with one implementation (that last is `rules/yagni.md` in the fundamentals, which Go makes easy to violate): those are `reviewing-diffs`.\n\n**Security of the change.** Untrusted input reaching `exec.Command`, SQL built by hand, a path from a request: that is the security disciplines (`reviewing-untrusted-input`, `reviewing-secrets`, `reviewing-sensitive-data`, `reviewing-model-use`).\n\n**Another language.** A `.py`, `.ts` or `.rs` file in the same change is read by that language's skill.\n", "lines": 46}, {"id": "reviewing-rust", "group": "Linguagens", "name": "reviewing-rust", "source": "engineering/rust/skills/reviewing-rust/SKILL.md", "when": "Rota rust.", "description": "Use when a change under review edits Rust (.rs) and the question is what a Rust reader would catch - an unwrap or expect on a path that can fail, an unsafe block that does not justify itself, an as cast that truncates, a clone that hides a design problem, a Result swallowed, a public surface that leaks or over-constrains. Reads the routed files against the conditions below; every finding names the condition.", "text": "# Reviewing Rust\n\nThe language-agnostic pass in `ahrena-engineering-quality:skills/reviewing-diffs/SKILL.md` has read the change against the rules that hold in any language. The Rust compiler and the borrow checker have already decided more than most languages' do. This skill reads what is left to a Rust reader: the panics a library should not take, the `unsafe` that has to earn its place, the ownership choices the compiler accepts but a reader questions, and the API surface.\n\nThe conditions are checklists in `references/`, identified by a prefix and a number. A finding cites the identifier. Severity and route follow `ahrena-engineering-quality:docs/review-findings.md`.\n\n## 1. Take the route, and read the repository first\n\nThe router fired the `rust` route on the changed `.rs` files. Those are the files this skill reads.\n\nRead whether the crate is a library or a binary (`Cargo.toml`, `lib.rs` vs `main.rs`): a `panic!` or an `unwrap` that is acceptable in a top-level binary is a defect in a library others depend on. Read the project's Clippy configuration and whether CI runs `cargo clippy -- -D warnings`: a lint it enforces — `clippy::unwrap_used`, `clippy::as_conversions` — is settled, and not reported again. Read `#![forbid(unsafe_code)]` or its absence. A green Clippy decides what it covers.\n\n## 2. Open the checklists the change calls for\n\n| What the change touches | Reference |\n|---|---|\n| an `unwrap`, `expect`, `panic!`, `unsafe`, an `as` cast, an array index, arithmetic | `references/panics-and-safety.md` |\n| a `clone`, a borrow, a lifetime, `Rc`/`RefCell`/`Arc`/`Mutex`, a `Send`/`Sync` boundary | `references/ownership-and-concurrency.md` |\n| a `Result`/`Option` handled, an error type, a `pub` item, a trait, a generic bound | `references/errors-and-surface.md` |\n\n## 3. Read beyond the hunk\n\nFollow each changed item to its callers and to what it borrows from. Whether an `unwrap` is safe is decided by what the function it calls can return, which its signature and body show. Whether a lifetime is right is decided by what outlives what. Read the base revision before calling a line wrong.\n\n## 4. Apply the routed conditions\n\nWork condition by condition. Give the scenario in Rust terms: the input or state, the panic, the truncation, or the needless allocation, and what it should have been. A condition whose answer is a project convention the repository does not state is a `question`.\n\nRead each condition's `Exempt` line. An `unwrap` on an invariant the code guarantees, an `unsafe` with a correct safety comment, a `clone` that is genuinely cheapest — each is correct, and reporting it costs the reviewer's credit.\n\n## 5. Write the findings\n\nEach finding carries the four fields in `ahrena-engineering-quality:docs/review-findings.md`, with the condition identifier and a correction that is an instruction.\n\nHand the set back to step 7 of `ahrena-engineering-quality:skills/reviewing-diffs/SKILL.md`. Do not publish from here, and do not edit the change.\n\n## When this skill does not apply\n\n**A language-agnostic defect.** Length, nesting, duplication, a premature trait with one implementor: those are `reviewing-diffs` and the fundamentals rules.\n\n**What the compiler already rejects.** A use-after-move, an aliased mutable borrow, a missing lifetime: the borrow checker decides these and the change would not compile. This skill reads what compiles and is still wrong.\n\n**Security of the change.** Untrusted input reaching a command or a query, a secret, deserialisation of hostile data: that is the security disciplines (`reviewing-untrusted-input`, `reviewing-secrets`, `reviewing-sensitive-data`, `reviewing-model-use`).\n\n**Another language.** A `.py`, `.ts` or `.go` file in the same change is read by that language's skill.\n", "lines": 46}, {"id": "reviewing-artifacts", "group": "Artefatos do framework", "name": "reviewing-artifacts", "source": "foundation/skills/reviewing-artifacts/SKILL.md", "when": "Rota framework-artifacts: regra, doc, skill, agente ou comando do framework.", "description": "Review a rule, doc, skill, agent or command for the defects a gate cannot detect. Use when reviewing a pull request that adds or changes artifacts, when an artifact passes CI but reads wrong, or when auditing an existing corpus before building on it. Covers type choice, conditions versus maxims, missing thresholds, drift between an artifact's opening and its body, enforcement route, and always-loaded footprint.", "text": "# Reviewing artifacts\n\nThe gate protects the shape of the corpus. This protects its content. An artifact that passes every check in `hooks/validate-artifacts.py` can still be the wrong type, state a maxim nobody can apply, or quietly add a hundred tokens to every request.\n\n## 1. Run the gate before reading anything\n\n```sh\npython3 <plugin>/hooks/validate-artifacts.py\n```\n\nSpending review attention on kebab-case is waste. If the gate is red, the review has not started yet.\n\nIt now also decides leftover markers, unreplaced placeholders and missing sections, so those are off your list. What it cannot decide is whether a section that exists says anything: a `Where this stops` reading \"use judgment\" passes the gate and fails step 9.\n\n## 2. Challenge the type\n\nThis is where most defects are, so it comes first.\n\nTake the artifact and ask the question from `docs/artifact-model.md`: **can it be violated, and is the result defective?** If violating it merely produces something different, it is not a rule, whatever the directory says.\n\n| What you find | What it is |\n|---|---|\n| A rule whose body is mostly explanation | a doc with a rule-shaped title |\n| A doc with numbered steps and an end state | a skill |\n| A skill that only picks between other skills | an agent |\n| A command with logic in it | a skill that was never written |\n\nReclassifying is cheap now and expensive after three artifacts reference it.\n\n## 3. On a rule, hunt for maxims\n\nA condition names a detectable state. A maxim names a virtue. They read the same to a careless eye and behave completely differently when an agent tries to apply one.\n\n| Maxim | Condition |\n|---|---|\n| \"A class should do one thing\" | \"LCOM4 above 1 marks a split candidate\" |\n| \"Avoid deep nesting\" | \"A function with nesting depth above 3\" |\n| \"Do not lie about the interface\" | \"`raise NotImplementedError` in a concrete type\" |\n\nEvery numbered condition must say what decides it. A condition with no detector named is a maxim that has been numbered.\n\n## 4. Put a number where a quantity word stands\n\n\"Many\", \"several\", \"fast\", \"simple\", \"complex\", \"reasonable\", \"large\", \"high latency\", \"low cost\". Each of these sits in a place where a number belongs, and two readers will pick two different numbers and both be right.\n\nThis is not step 3 run again. A maxim has no measurable state behind it: \"a class should do one thing\" cannot be given a threshold, only rewritten into a different condition. An ambiguity has one and the author left it out: \"the lookup is fast\" is about latency, which is measured every day, and only the figure is missing. A maxim is replaced; an ambiguity is filled in.\n\nCarry the number in the finding. A review that only circles the word hands the author the same blank page they already had. \"Many cases\" becomes \"at least 80% of observed cases\", \"fast\" becomes \"p99 at or under 300ms\". A proposal wrong by a factor of two is still progress, because it gives the author something to disagree with.\n\nOne case is legitimate: the number genuinely arrives in a later phase, after the load test or the pilot. That is acceptable only when the artifact says so and names what produces the figure. An ambiguity with its arrival declared is a plan. The same words without it are a gap.\n\n## 5. Read the statement with no context\n\nA rule's `statement` reaches the agent alone, with a link. Read it cold, as the only thing you know, and ask whether you could act on it. If it needs the body to make sense, it is a summary rather than a statement, and the rule will be ignored in exactly the situation it exists for.\n\n## 6. Read the top against the bottom\n\nWhat an artifact declares up front and what it does further down were written at different times, and only one of them gets edited when something changes.\n\n| Declared | Read it against |\n|---|---|\n| The `statement`, or a skill's opening objective | the conditions or steps below it |\n| A \"correct\" and \"incorrect\" pair | the rule the pair illustrates |\n| Declared inputs and outputs | whether each input is consumed by a step, and each output produced by one |\n| A count asserted in prose | the number of items actually present |\n\nEach half reads fine alone, which is why these survive every review that reads the artifact once from the top. Reading the halves against each other is the only thing that catches them.\n\nA drifted example is the worst of the four. When the rule and the example disagree, readers follow the example, so the defect ships as compliance.\n\n## 7. Question the enforcement route\n\nFor every rule declaring `enforcement: judgment`, ask whether a script could have decided it.\n\nThis is the check that decays a corpus fastest if it is skipped. Writing a hook is work, declaring `judgment` is free, and the gap between them is where a framework accumulates rules that nobody enforces and everybody cites.\n\nIf the condition is decidable and the hook is missing, that is a finding, not a follow-up.\n\n## 8. Check where the rationale sits\n\nExplanation in a rule makes the rule long, and a long rule is one nobody loads. Explanation absent from the doc makes the rule arbitrary, and an arbitrary rule is one people route around.\n\nBoth failures are common. Look for the pair: the rule states, the doc explains, and the rule references the doc.\n\n## 9. Demand a real \"where this stops\"\n\nA section that says \"use judgment\" is not a boundary. A real one names the case where applying the artifact harder makes the outcome worse, and it is the section that separates a rule from dogma.\n\nIf the author could not find one, either the artifact is narrower than it claims or it has not been used yet.\n\n## 10. On a skill or an agent, test the description\n\n`description` is the only text a platform reads when deciding whether to load the artifact. It has one job: fire in the right situation and stay quiet otherwise.\n\nRead it and ask what situations it names. A description that describes capability (\"creates artifacts\") rather than occasion (\"when adding a new rule, doc, skill, agent or command\") will not trigger, and the artifact might as well not exist.\n\n## 11. Separate references from mentions\n\nEvery entry in `references` declares a dependency. Prose that names another artifact does not.\n\nOver-declaring is the common direction, and it is not harmless: the graph is what a reader trusts to know what depends on what, and noise in it makes the real edges invisible.\n\n## 12. Price the footprint\n\nAsk what this artifact adds to a request that has nothing to do with it.\n\nA hook rule costs zero. A judgment rule costs one line. A doc costs nothing until something reads it. A skill costs its `description` in every listing, and its body every time it fires.\n\nThe gate already decides two of these: the 10-line cap on code blocks in a body, and whether every file in a skill's body is reachable from a step. What is left for you is the part no threshold reaches. A body with no code at all can still be three times longer than the procedure needs, and material can sit in the right tier while being the wrong material. `rules/progressive-disclosure.md` states the mechanics; `docs/context-budget.md` gives you the accounting to argue with.\n\n## 13. Report\n\nGroup findings by severity, and say plainly which are blocking.\n\nName the rule or the condition behind each one. A review that says \"this feels heavy\" cannot be acted on and will be argued with; a review that says \"condition 3 names no detector, so `hooks/` cannot decide it\" ends the discussion.\n\n## When this skill does not apply\n\nReviewing code that an artifact governs. This reviews the artifact, not the codebase it constrains. Those reviews use the engineering rules, not this one.\n", "lines": 120}, {"id": "review-routes", "group": "Documentos de apoio", "name": "review-routes", "source": "engineering/quality/docs/review-routes.md", "when": "O formato das rotas e por que a seleção é uma tabela.", "description": "Why the skills a review loads are chosen by a route table and a script, what the three drivers of a route read, what a baseline route and an unrouted path mean, and how a route is added.", "text": "# How a review selects its skills\n\nThis is the companion to step 2 of `skills/reviewing-diffs/SKILL.md`. That step runs `hooks/route-review.py`; this says what the script reads, why it is a script, and what its output does and does not claim.\n\n[`docs/review-findings.md`](review-findings.md) argues why a review routes at all: reading every rule against every diff examines nothing closely. The same argument holds one level up. A reviewer with a skill for security and a skill for prompts, loading both on a change to a build script, spends its attention on conditions that cannot fire.\n\n## A route is data\n\nThe table is `skills/reviewing-diffs/references/routes.json`. One route is one object.\n\n| Key | What it holds |\n|---|---|\n| `id` | the route's name, unique in the table, and what a skill's own step 1 looks for |\n| `skill` | the skill the route selects, plugin-relative, or `plugin:path` for a skill in another plugin |\n| `opens` | the files that skill reads for this route: a rule, a checklist in its `references/`, a detector |\n| `why` | one sentence, for the person reading the table |\n| `paths`, `lines`, `contains` | the drivers, each a list of regular expressions |\n| `baseline` | `true` on a route that reaches every file |\n\n**The table is the only place a pattern lives.** A skill's step 1 lists route identifiers and what each opens. It does not repeat an expression, so there is one place to edit and nothing to drift.\n\n## The three drivers\n\nA route fires on a changed file when every driver it declares matches. Within one driver, any expression in the list is enough.\n\n**`paths` reads the file's path.** This is the cheap driver and most routes need no other. A migration directory, a manifest's filename and an instruction file's name are all decided here.\n\n**`lines` reads the lines the change adds.** A path cannot say that a Python file now calls a model or builds a query from text, and those are the changes the security and prompt skills exist for. The driver reads added lines only: a call that was already in the file is not this change's, and firing on it would send every later edit of that file through a review it does not need. The output names the first line that matched, so the skill starts reading where the route fired.\n\n**`contains` reads the whole file at the head.** It is for a fact about what the file is and not about what changed. The one route that uses it tells an artifact of this framework from any other markdown file under `agents/` by the `clade` field in its frontmatter.\n\nExpressions are Python's `re` syntax and are searched, not anchored. A deleted file has no added lines and no text, so it can fire a route that declares `paths` alone, which is what a removed contract needs.\n\n## Why regular expressions and why a script\n\nThe route table this replaces was a column of prose: \"any handler, client or job entry point\". Two readers classify that differently, and one reader classifies it differently on two days. The reviews then differ before either has read a line.\n\nA regular expression is wrong in a fixed way. A file the pattern misses is missed every time, somebody notices, and the table gets a line. That is the trade [`docs/simplicity.md`](../../fundamentals/docs/simplicity.md) argues for elsewhere: a detector that decides less, and decides it the same way twice.\n\nThe script exists so that the table is applied and not paraphrased. It prints which routes fired and on what, which makes the selection something a second reader can check against the diff.\n\n## A driver says where to look\n\nA route firing is not a finding and not a suspicion. The line driver for untrusted input matches every call to `open(`, and nearly all of them are fine. What the route buys is that the checklist for paths is open when the reviewer reads that line, and closed when the change contains no such line.\n\nThe cost runs both ways and is accepted in one direction only. A driver that is too wide loads a checklist that finds nothing, which costs attention. A driver that is too narrow skips a checklist that would have found something, which costs a missed finding. The line drivers are written wide for that reason.\n\n## Baseline routes and unrouted paths\n\nA baseline route fires on every file that is not ignored. The secret sweep is the one the table ships: a credential can be pasted into any file type, so no path pattern is right for it.\n\nA baseline does not count as coverage. A path that only a baseline reaches is printed as `unrouted`, and the review says so. A changed `Makefile` was swept for a credential and read against nothing else, and a reader of a clean review should know that.\n\nPaths matched by `ignore` select nothing, the baseline included: lockfiles, vendored and built directories, minified bundles, snapshots. They have no authored lines.\n\n## Adding a route\n\nAdd one object to the table, and when it opens a new file, write that file. `hooks/test-route-review.py` fails on a route that names a skill or a file that does not exist, on an expression that does not compile, and on a route with no driver.\n\nA new review skill needs no change to the router and none to the agent's procedure: its routes select it. Its own step 1 lists the route identifiers it answers to.\n\nA consumer with a layout the patterns miss passes its own table with `--routes`. The router reads no configuration file.\n\n## Where this stops\n\n**The router does not read meaning.** Whether a file is \"a handler\" is decided by its name and directory. A handler in a file called `process.py` at the root is reached by the source route and not the edges route. The `unrouted` list and the fallback to the language-agnostic rules are what keep that miss visible.\n\n**It does not decide severity, order or verdict.** It selects what is read. Everything after that is the skills'.\n\n**It is not a security scanner.** A line driver that matches `password` is not reporting a password. Treating the router's output as findings would publish dozens of them on an ordinary change, and would teach the author to ignore the review.\n\n**It does not replace reading the description.** A change whose paths and added lines look like a refactor and whose description says it changes who may approve a payment needs the access checklist. The reviewer may open a skill no route selected, and says in the review that it did and why.\n", "lines": 73}, {"id": "review-findings", "group": "Documentos de apoio", "name": "review-findings", "source": "engineering/quality/docs/review-findings.md", "when": "Os quatro campos de um achado e as quatro severidades.", "description": "The four severity levels and the test that assigns each, why a finding names a file, a line and a condition rather than a virtue, why the review routes by changed path, and why an external fork's checkout is never executed.", "text": "# What a review finding owes its reader\n\nThis is the companion to the review procedure in `skills/reviewing-diffs/SKILL.md` and `skills/detecting-contract-breaks/SKILL.md`. Those skills say what to do; this says what a finding has to contain before it is worth writing down, what each severity level means in terms a second reviewer would apply the same way, and the two boundaries the procedure will not cross.\n\nA review is worth its cost when the author can act on it without a conversation. Everything below is in service of that one property.\n\n## A finding names a file, a line and a condition\n\nThree fields, and a finding missing any of them is not a finding.\n\n**The file and the line** are where the state was observed. Not the module, not the class, not \"the approval flow\" — the line, because the author has to find it, and a finding that costs a search is a finding that gets deferred.\n\n**The rule and the condition number** are what the state violates. Every rule in this plugin numbers its conditions, and each numbered condition names a detectable state and what decides it. Citing the rule without the number hands the author eleven pages; citing the number hands them one sentence they can agree or disagree with.\n\n**The state observed** is what is actually there, phrased so a reader can check it against the line. \"This function nests control flow 5 deep\" is checkable. \"This function is hard to follow\" is not, and it is the same defect the reviewing procedure in this framework's foundation plugin calls a maxim: a virtue where a condition belongs.\n\nA fourth field is optional and usually worth its space: the change that resolves it. Most conditions in this plugin name their own fix — splitting the function, deleting the statement, moving the boundary — so the sentence is short, and its absence is what makes a reviewer sound like an obstacle rather than a colleague.\n\n**What this rules out is vague feedback.** \"Looks good\", \"consider refactoring this\", \"not sure about this approach\" and \"could be cleaner\" are each a reviewer's impression with the reasoning removed. They cost the author a round trip to discover what was meant, and they cannot be argued with, because there is nothing stated to disagree with. If the impression is real, it is a question (see below) and it is written as one.\n\n## The four severity levels\n\nThe predecessor of this procedure carried two levels and distinguished them by colour, which tells a reader the weight of a finding and nothing about how that weight was decided. These four are each defined by a test, so two reviewers reading the same finding assign the same level.\n\n| Level | The state | The test that assigns it |\n|---|---|---|\n| **blocking** | a numbered condition is violated by a line this change introduces or edits | the finding names the rule, the condition, the file and the line, and the line is inside the diff |\n| **deferrable** | the same violation, on a line the change did not touch, or where the fix reaches code the change does not | the finding names the same four things, and the line is outside the diff or the fix is |\n| **question** | a condition the reviewer cannot decide without an input only the author or the wider organisation holds | the finding names the condition, the missing input, and which answer would settle it either way |\n| **unchecked** | a condition nothing decided, because a detector, a base version or permission to execute was unavailable | the finding names the condition and why it was not decided |\n\n**Only blocking stops the change.** The other three are not weaker forms of it. Each names a different reason the reviewer is not entitled to demand a fix in this pull request, and collapsing them is how a review turns into a list of things the author is expected to feel bad about.\n\n**Deferrable is about the diff, not about importance.** A pre-existing violation is real and the author did not introduce it. Asking them to fix it because they happened to edit the file next door is how an unrelated change grows a refactor, and the refactor is then reviewed by nobody. The finding is recorded so the next person has it; it does not gate this change.\n\n**Question is the level the gated conditions produce.** Eight conditions across five rules are gated by the abstraction trigger in `rules/yagni.md` — three in `rules/solid.md`, two in `rules/value-semantics.md`, and one each in `rules/duplication.md`, `rules/cross-cutting-concerns.md` and `rules/pattern-selection.md` — and that rule's own boundary section says the count cannot be decided from a tree that does not contain every consumer. A reviewer who marks such a finding blocking has asserted something they cannot see. A reviewer who drops it has thrown away the one question worth asking. It is a question, and the author answers it.\n\n**Unchecked is a statement about the review, not about the code.** It says an axis was not covered, which is exactly what the reader of a green review needs to know and exactly what a review that reports only violations conceals.\n\n## Why the review routes by changed path\n\nThe thirteen rules in this plugin do not all reach every change. The conditions in `rules/domain-model.md` are about modules under a context's `domain/` directory; the conditions in `rules/contract-first.md` are about a published contract document; the shipped detector parses Python and nothing else.\n\nReading every rule against every diff produces two failures at once. The reviewer spends its attention on conditions that cannot fire, and the conditions that can fire get a fraction of what they deserve. Routing is what buys the depth: the changed paths select a small set of rules, and each one is then read properly against the lines that could violate it.\n\nThe cost of routing is a miss when a path is classified wrongly, and it is a real cost. A file with no extension the route map knows falls through to the language-agnostic conditions, which is the weaker route, and the route map says so rather than pretending the default is complete.\n\n## Why an external fork's checkout is not executed\n\nFive conditions in this plugin are decided by running something. Condition 3 of `rules/solid.md` runs the supertype's own tests against a subtype. Condition 4 of `rules/cross-cutting-concerns.md` replays one request twice with one key. Conditions 2, 3 and 4 of `rules/contract-first.md` start the service to fetch what it serves, run a test per declared operation, and validate a captured event against the CloudEvents schema inside that test. A reviewer that wants any of those five answers has to build the project and run its suite.\n\nBuilding a project executes code the change's author controls. Not only the test files in the diff — the dependency manifest, the build script, the package post-install hook, the test configuration and every transitive dependency they name. On a pull request whose head is a branch in the same repository, the author already had write access and this buys nothing. On a pull request from an external fork, the author is a stranger, and bootstrapping their checkout runs their code on the reviewer's machine with the reviewer's credentials in the environment.\n\nSo the procedure does not do it. It records an `unchecked` finding that names each condition it could not decide and the reason, and it continues with everything that only reads: the shipped detector, the judgment conditions, and the contract comparison, which is a diff of two documents and executes nothing.\n\n**This is a refusal, not a gap to close later.** The suggestions that come up are a sandbox, a container or a disposable runner, and each of them is a real answer to a different question — how to run untrusted code safely — which is a piece of infrastructure the consuming project either has or does not. This plugin has no way to know which, and a procedure that assumes the sandbox exists is a procedure that silently executes a stranger's code on the machines where it does not. `docs/simplicity.md` records the general form of this position: a detector that is confidently wrong is worse than an absent one, and the same holds for a safety precondition that is confidently assumed.\n\n## Where this stops\n\n**The levels say nothing about how many findings a review should have.** A review with forty blocking findings on a small change is either reviewing generated code or applying a rule where its boundary section says not to, and both are the reviewer's defect rather than the author's. Nothing here detects that; a second reader does.\n\n**Nothing here decides what happens to the findings.** Which verdict a set of findings produces, when the reviewer may approve, and how the result is published are in `docs/review-verdicts.md`, because they are about the reviewer's history on the pull request rather than about the change.\n\n**The route map is not a taxonomy of software.** It maps the paths this plugin's conditions can reach. A change touching something none of the thirteen rules is about produces a review that says so, and that is the honest output rather than a failure of the map.\n", "lines": 65}, {"id": "review-verdicts", "group": "Documentos de apoio", "name": "review-verdicts", "source": "engineering/quality/docs/review-verdicts.md", "when": "Quando o revisor aprova, e a separação que o auto-fix preserva.", "description": "Why the verdict follows the findings alone, what an approval on the first pass asserts and what makes it worth something, the three rows, why one comment per commit and the earlier one is left standing, why the marker is readable, and why the reviewer never edits the change.", "text": "# The verdict a review publishes\n\nThis is the companion to the publication procedure in `skills/publishing-review-verdicts/SKILL.md`. That skill says what to do; this says why the verdict is assigned the way it is, what each of the three rows protects, and what the comment marker buys.\n\nThe severity levels the table reads are defined in [`docs/review-findings.md`](review-findings.md). Nothing here re-decides them. This repository's `ADR-013` records the decision this document argues, and the rule it replaced.\n\n## The verdict follows the findings\n\nOne axis: the highest severity present now.\n\n| Findings now | Verdict |\n|---|---|\n| at least one **blocking** | request changes |\n| no blocking, but at least one question or unchecked | comment |\n| deferrable only, or nothing at all | approve |\n\n**Row one stops the change.** A blocking finding is a numbered condition violated on a line this change introduces or edits, and the author owes a fix or an argument.\n\n**Row two is a review that has not finished.** A question is addressed to the author and the answer may turn it into a blocking finding. An unchecked condition is a part of the change nobody read. Approving over either is approving over a hole, so neither approves, however clean the rest is.\n\n**Row three is the approval, and it can arrive on the first pass.** Deferrable findings do not hold it back: each is a real violation on a line the change did not touch, recorded for the next person, and by its own definition not this pull request's to fix.\n\n## What an approval on the first pass is worth\n\nThe failure an approving reviewer has to answer for is specific. An automated reviewer runs on a pull request, finds nothing, approves, and that approval is indistinguishable from the one it would have produced if it had been pointed at the wrong base, given an empty diff, or unable to read the change. A person who approves everything is noticed. An automated reviewer is not, because nobody reads a stream of approvals looking for the one that should not be there.\n\nThe predecessor of this rule answered by forbidding the first approval: the reviewer could approve only after having itself requested changes on the same pull request. That made an approval mean \"what I objected to is gone\", and it declined every change that was right from the first commit.\n\nThe answer here is that the approval carries its own evidence. A review states the base and the head it read, the routes that fired, the skills no route selected, the paths nothing but the baseline reached, and every condition it did not decide. A reviewer pointed at an empty diff reports no routes. One that could not run a check reports it unchecked, and by row two does not approve.\n\n**So an approval asserts this, and no more:** over the commit named in the marker, every routed condition was decided and none is violated by a line the change touched. It does not assert that the change is wanted, or that nothing outside the routes is wrong.\n\n**What that costs is the second chance.** Under the old rule a person merged every change, and could notice what the review missed. An approval now lands the change, through `skills/landing-approved-changes`, and what a miss meets is CI on trunk and the revert. A repository that cannot afford that requires a named person's approval in its ruleset, and the forge holds the merge.\n\n## When the forge refuses the approval\n\nGitHub does not let an account approve its own pull request. Where the reviewer publishes through the author's account, the approving review is refused.\n\nThe verdict does not change. It is published as a comment whose verdict line reads approve, and the comment says the forge refused the review and why. Landing reads the verdict, not the review's state on the forge. Where the ruleset requires an approving review, the merge is then refused too, and the pull request waits for a person, which is the ruleset doing what it was set to do.\n\n## One comment per commit, and the earlier ones stay\n\nThe reviewer publishes a marker on the first line of the comment body, derived from the pull request number and the head commit the review looked at.\n\nThe marker does two things. It makes a re-run on the same commit idempotent: the reviewer finds its own earlier comment carrying the same marker and edits that comment instead of adding a second one, so a review triggered three times produces one comment rather than three copies of the same list. And it makes a re-run on a new commit a new comment, because the marker no longer matches anything.\n\n**The earlier comment is left exactly where it is.** It is not deleted, edited or collapsed, and there are two reasons.\n\nThe first is that it is not stale. It is an accurate review of a commit that existed, and the fact that a later commit fixed three of its findings is information a reader wants, not noise to clean up.\n\nThe second is that the trail is the record of what the reviewer said at each commit. An approval that follows two requests for changes reads differently from one that arrived alone, and a reader can see that only while the earlier comments stand.\n\n**Re-running on the same commit is the one case where content is replaced**, and the marker is what makes it safe: the verdict being overwritten is a verdict about the same commit, so nothing about a different state of the change is lost.\n\n## Why the marker is readable rather than hashed\n\nThe obvious construction is a hash of the pull request number and the commit, truncated, in a comment. It is what the predecessor of this procedure used.\n\nA plain, readable marker is better on three counts, and is no less idempotent. It needs no tool to produce, which matters because the reviewer may be running somewhere with no shell. It needs no tool to verify: a person reading the comment source can see which commit was reviewed, which is a question people actually ask when a review looks out of date. And a mismatch is legible — two markers that differ show which commits they belong to, where two truncated hashes show only that they differ.\n\nThe hash buys one property, which is a fixed length, and the marker is not stored anywhere that needs one.\n\n## Why the reviewer never changes the pull request\n\nThe reviewer publishes its review, and after an approval asks the forge to land the commit it reviewed. It does not commit, push, rebase, re-target, label, assign, request other reviewers, resolve threads or close.\n\nA reviewer that fixes what it finds has stopped being a reviewer of that change, because the next thing it reviews includes its own work, and nobody reviews that. The separation is the whole value of a second party looking, and it survives only while the second party leaves the content of the change alone. Landing does not touch the content: it merges the commit that was read, named by its hash, and a head that moved since the review is not landed.\n\nThere is a second reason, smaller and more practical. A fix-up commit from the reviewer moves the head, which invalidates the marker of the review that proposed it, which turns one comment into two about the same state. The mechanism and the principle point the same way.\n\n## Where this stops\n\n**Nothing here decides what a ruleset requires.** Required approvals, required checks and who owns a surface are the repository's settings, and an approval here does not stand in for any of them.\n\n**Nothing here covers other reviewers.** A pull request usually carries comments from people and from other automated reviewers. Reading, aggregating or answering those is outside this procedure: this reviewer publishes its own verdict and leaves everyone else's threads alone.\n\n**The approval is only as good as the coverage statement beside it.** A review whose routes missed the part of the change that mattered approves a change it did not read, and says which routes fired. Reading that list is what a person checking an approval does.\n", "lines": 78}], "orchestration": "## Como o Argos opera\n\nO Argos é o revisor. Numa passada ele fixa a base e o head, roda o roteador (um script que lê a mudança contra a tabela de rotas e diz quais disciplinas tocam o diff), delega a cada disciplina selecionada, junta os achados e decide **um** veredito a partir deles — sem olhar a história:\n\n- um achado **bloqueante** → pede mudança;\n- uma **pergunta** ou condição **unchecked**, sem bloqueante → comentário (a revisão não terminou);\n- nada que trave → **aprova**.\n\nAo aprovar, ele pede ao forge (o GitHub) para fazer o **squash-merge do commit exato que revisou**, só com os checks verdes. Ele não dá push na trunk nem decide sozinho: quem mescla é o forge, pelas regras dele.\n\nA mudança bloqueante vai para o **Erodos** — um agente separado, para que o Argos nunca leia a própria edição — e o commit que o Erodos devolve volta a esta mesma revisão. Quatro casos ele deixa para uma pessoa, aconteça o que acontecer: registro de decisão, camada de stack, draft e pull request de fork externo. `ADR-013` registra por que a revisão limpa aprova e mescla.\n"};
const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const SAFE = /^(?:https?:|#)/i;
if (window.marked) marked.use({ renderer: {
  html: (h) => esc(typeof h === 'string' ? h : h.text),
  link: (href, title, text) => SAFE.test(href || '') ? '<a href="' + esc(href) + '">' + text + '</a>' : text,
  image: (href, title, text) => esc(text || ''),
} });
const md = (t) => window.marked ? marked.parse(t).replace(/<table>/g, '<div class="tblp"><table>').replace(/<\/table>/g, '</table></div>') : '<pre><code>' + esc(t) + '</code></pre>';
const el = (id) => document.getElementById(id);

function show(entry, scroll) {
  el('name').textContent = entry.name;
  el('source').textContent = entry.source + ' · ' + entry.lines + ' linhas';
  el('when').innerHTML = '<b>Quando entra:</b> ' + esc(entry.when);
  el('desc').textContent = entry.description || '';
  el('prose').innerHTML = md(entry.text);
  for (const b of document.querySelectorAll('#index button')) b.setAttribute('aria-current', b.dataset.id === entry.id ? 'true' : 'false');
  el('copy').onclick = async (ev) => {
    try { await navigator.clipboard.writeText(entry.text); ev.target.textContent = 'Copiado'; }
    catch { const r = document.createRange(); r.selectNodeContents(el('prose')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ev.target.textContent = 'Selecionado: copie com o teclado'; }
    setTimeout(() => { ev.target.textContent = 'Copiar o texto'; }, 1800);
  };
  try { history.replaceState(null, '', '#' + entry.id); } catch {}
  if (scroll) el('h-texts').scrollIntoView({ block: 'start' });
}

function selectTab(which) {
  const prompts = which !== 'orchestration';
  el('tab-prompts').hidden = !prompts;
  el('tab-orchestration').hidden = prompts;
  el('t-prompts').setAttribute('aria-selected', prompts ? 'true' : 'false');
  el('t-orchestration').setAttribute('aria-selected', prompts ? 'false' : 'true');
  try { history.replaceState(null, '', '#' + (prompts ? 'prompts' : 'orchestration')); } catch {}
}

function start() {
  if (!DATA) { el('lead').textContent = 'A página foi publicada sem os dados: rode o build.py.'; return; }
  el('eyebrow').textContent = DATA.eyebrow;
  el('title').textContent = DATA.title;
  el('lead').textContent = DATA.lead;
  el('meta').textContent = 'Retrato do ahrena-framework no commit ' + DATA.commit + '. ' + DATA.entries.length + ' textos.';
  el('orch').innerHTML = md(DATA.orchestration);

  const layers = el('layers');
  for (const L of DATA.layers) {
    const li = document.createElement('li');
    li.innerHTML = '<b>' + esc(L.name) + '</b><span>' + md(L.body) + '</span><span class="when">' + esc(L.when) + '</span>';
    layers.appendChild(li);
  }

  const byId = Object.fromEntries(DATA.entries.map((e) => [e.id, e]));
  const short = (s) => s.replace(/^.*skills\//, '').replace(/\/SKILL\.md$/, '');
  if (DATA.routes.length) {
    el('routes-sec').hidden = false;
    const rows = el('routes');
    for (const r of DATA.routes) {
      const kinds = ['paths', 'lines', 'contains'].filter((k) => (r[k] || []).length);
      const pills = (r.baseline ? '<span class="pill baseline">baseline</span>' : '') + kinds.map((k) => '<span class="pill ' + k + '">' + k + ' · ' + r[k].length + '</span>').join('');
      const pats = kinds.map((k) => k + '\n' + r[k].map((p) => '  ' + p).join('\n')).join('\n');
      const target = short(r.skill), opens = (r.opens || []).map((o) => o.replace(/^.*\//, '').replace(/\.md$/, ''));
      const tr = document.createElement('tr');
      tr.innerHTML = '<td class="id">' + esc(r.id) + '</td><td>' + pills + (pats ? '<details><summary>ver as expressões</summary><pre>' + esc(pats) + '</pre></details>' : '') + '</td>'
        + '<td>' + (byId[target] ? '<button class="skill" type="button" data-id="' + esc(target) + '">' + esc(target) + '</button>' : esc(target))
        + (opens.length ? '<div class="note" style="margin-top:2px">abre ' + esc(opens.join(', ')) + '</div>' : '') + '</td><td class="why">' + esc(r.why || '') + '</td>';
      rows.appendChild(tr);
    }
    rows.addEventListener('click', (ev) => { const b = ev.target.closest('.skill'); if (b) { selectTab('prompts'); show(byId[b.dataset.id], true); } });
    el('routes-note').textContent = 'Uma rota dispara quando todos os tipos de direcionador que ela declara casam no mesmo arquivo. A baseline alcança todo arquivo; um arquivo que só ela alcança sai como unrouted.';
  }

  const index = el('index');
  let group = null, box = null;
  for (const e of DATA.entries) {
    if (e.group !== group) { group = e.group; box = document.createElement('div'); box.className = 'group';
      const h = document.createElement('h3'); h.textContent = group; box.appendChild(h); index.appendChild(box); }
    const b = document.createElement('button'); b.type = 'button'; b.dataset.id = e.id; b.textContent = e.name; b.onclick = () => show(e, false); box.appendChild(b);
  }

  el('t-prompts').onclick = () => selectTab('prompts');
  el('t-orchestration').onclick = () => selectTab('orchestration');

  const hash = (location.hash || '').slice(1);
  if (hash === 'orchestration') selectTab('orchestration'); else selectTab('prompts');
  show(byId[hash] || DATA.entries[0], false);
}
start();
</script>
