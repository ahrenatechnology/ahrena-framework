# Installed by Ahrena: ahrena-contributing, skills/installing-issue-forms.
# Adapted from the predecessor framework's forms. The sections map to the
# issue-quality rule, and `Acceptance criteria` is what the traceability check reads.
# For a capability whose delivery surface is a command-line entrypoint
# (component map delivery: cli | tui), not an HTTP API.
name: "CLI User Story"
description: "Template for a command-line (CLI/TUI) user story: acceptance criteria and the entrypoint's surface — command, arguments, I/O and exit codes."
title: "{{ summarize the user story here }}"
type: User Story
labels:
  - "status: to refinement"

body:
  - type: markdown
    attributes:
      value: |
        Fill in the fields below to register a user story whose delivery surface is a command-line entrypoint. Use this instead of the API story when the capability is run as a command, not called over HTTP.

  - type: markdown
    attributes:
      value: "## Objective (User Story)"

  - type: input
    id: user-role
    attributes:
      label: "As a (user role / persona)"
      description: Who runs the command?
      placeholder: e.g. a release engineer
    validations:
      required: true

  - type: input
    id: specific-objective
    attributes:
      label: "I want (specific objective)"
      description: What does the persona want the command to do?
      placeholder: e.g. convert an amount between two currencies at a given rate
    validations:
      required: true

  - type: input
    id: benefit-and-value
    attributes:
      label: "So that (benefit and value)"
      description: What is the benefit or value?
      placeholder: e.g. I get the equivalent value without opening a spreadsheet
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Acceptance Criteria"

  - type: textarea
    id: happy-path
    attributes:
      label: "Happy Path Scenario"
      description: Success scenario in Gherkin format, phrased as running the command
      value: |
        ```gherkin
        Scenario: {success_scenario_name}
          Given {pre_condition}
          When I run `{command} {args}`
          Then stdout is {expected_output}
          And the exit code is 0
        ```
    validations:
      required: true

  - type: textarea
    id: corner-cases
    attributes:
      label: "Corner Cases"
      description: Edge case scenarios in Gherkin format
      value: |
        ```gherkin
        Scenario: {edge_case_name}
          Given {pre_condition}
          When I run `{command} {args}`
          Then stdout is {expected_output}
        ```
    validations:
      required: false

  - type: textarea
    id: error-cases
    attributes:
      label: "Error Cases"
      description: Error scenarios — bad input or a rejected operation
      value: |
        ```gherkin
        Scenario: {error_scenario_name}
          Given {error_pre_condition}
          When I run `{command} {bad_args}`
          Then stderr contains {error_message}
          And the exit code is non-zero
          And stdout is empty
        ```
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance criteria"
      description: "Number the scenarios above, one line each: AC-1, AC-2 and upward, never renumbered. A test names the one it covers as #<issue>/AC-<n>."
      value: |
        - AC-1: <happy path scenario, in one line>
        - AC-2: <corner case>
        - AC-3: <error case>
    validations:
      required: true

  - type: textarea
    id: left_to_other_issues
    attributes:
      label: "Left to other issues"
      description: "Decisions already made, work blocked elsewhere, and parts another issue owns, each by number."
    validations:
      required: false

  - type: markdown
    attributes:
      value: "## CLI Surface"

  - type: input
    id: command
    attributes:
      label: "Command"
      description: The command as invoked, with its positional arguments.
      placeholder: "convert <amount> <from> <to> <rate>"
    validations:
      required: true

  - type: textarea
    id: arguments
    attributes:
      label: "Arguments and options"
      description: Each positional argument and option, its type and whether it is required.
      value: |
        | Name   | Kind       | Type   | Required | Description  |
        |--------|------------|--------|----------|--------------|
        | amount | positional | string | yes      | description  |
        | --flag | option     | bool   | no       | description  |
    validations:
      required: false

  - type: textarea
    id: io-contract
    attributes:
      label: "Input / output / exit codes"
      description: What the command reads, what it writes to stdout/stderr, and the exit codes it returns.
      value: |
        - **stdin:** {what it reads, or "none"}
        - **stdout (success):** {what it prints}
        - **stderr (error):** {the message shape}
        - **exit codes:** 0 success; non-zero on {error condition}
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: "Examples"
      description: Concrete invocations and their output.
      value: |
        ```console
        $ {command} {args}
        {expected_output}
        ```
    validations:
      required: false

  - type: markdown
    attributes:
      value: "## Metrics"

  - type: textarea
    id: metrics
    attributes:
      label: "Metrics"
      description: Any usage, success-rate or performance metric worth collecting (optional for a CLI).
      value: |
        - {metric_1}
        - {metric_2}
    validations:
      required: false

  - type: markdown
    attributes:
      value: "## References"

  - type: textarea
    id: references
    attributes:
      label: "References"
      description: Links to relevant documentation
      value: |
        - [Product documentation](https://docs.example.com/)
        - {additional_reference}
    validations:
      required: false
