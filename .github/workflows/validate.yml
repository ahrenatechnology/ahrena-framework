name: validate

on:
  push:
    branches: [main]
  # `edited` because the pull-request check reads the title and the body,
  # and editing either changes what it would decide.
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  artifacts:
    name: artifact gate (${{ matrix.os }})
    # Two legs, because one class of defect in these hooks is invisible on one
    # of them. `rglob("SKILL.md")` matched a lowercase `skill.md` template and
    # failed the gate on every contributor's Mac while this job stayed green,
    # and no arrangement of files reproduces that on a case-sensitive
    # filesystem — the wrong answer comes from the filesystem, not from the
    # tree. A regression case is therefore only as good as the platform it
    # runs on, so the suites run on both. This repository is public, so the
    # macOS leg is free.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Read-only, and no more than the forge-tier checks read: the issues a
    # body closes, the pull request's closing references, and the
    # repository's merge settings and rulesets. ADR-002.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # Both actions are pinned past the Node 20 deprecation. The runner
      # already forces Node 24 on them and says so in a warning on every
      # run; these majors target it, so the warning goes and nothing is
      # left running on a version that is scheduled to stop working.
      #
      # The full history is fetched because contributing/hooks/check-commit-
      # message.py walks a revision range. The default shallow clone has one
      # commit and `git rev-list base..head` would be empty on it, which is a
      # gate that passes by seeing nothing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The gate ships with the plugin and takes no dependencies, so CI runs
      # exactly what a consumer runs. No install step, by design.
      # Tests first. A gate whose own tests are not in CI stops being
      # trustworthy the first time somebody edits it in a hurry.
      - name: Test the artifact gate
        run: python3 foundation/hooks/test-validate-artifacts.py

      - name: Test the structure hook
        run: python3 engineering/fundamentals/hooks/test-check-structure.py

      - name: Test the specifications hook
        run: python3 engineering/fundamentals/hooks/test-check-specifications.py

      - name: Test the boundaries hook
        run: python3 engineering/python/hooks/test-check-boundaries.py

      - name: Test the typing hook
        run: python3 engineering/python/hooks/test-check-typing.py

      - name: Test the branch-name hook
        run: python3 contributing/hooks/test-check-branch-name.py

      - name: Test the commit-message hook
        run: python3 contributing/hooks/test-check-commit-message.py

      - name: Test the decision-records hook
        run: python3 contributing/hooks/test-check-decision-records.py

      - name: Test the pull-request hook
        run: python3 contributing/hooks/test-check-pull-request.py

      - name: Test the trunk hook
        run: python3 contributing/hooks/test-check-trunk.py

      - name: Test the stack hook
        run: python3 contributing/hooks/test-check-stack.py

      - name: Test the traceability hook
        run: python3 contributing/hooks/test-check-traceability.py

      - name: Test the plan hook
        run: python3 contributing/hooks/test-check-plan.py

      - name: Validate the artifact corpus
        run: python3 foundation/hooks/validate-artifacts.py

      # The default issue forms are the single source; the guides an agent
      # reads are generated from them. A form edited without regenerating
      # its guide fails here. ADR-012.
      - name: Check the issue-form guides are current
        run: python3 contributing/skills/opening-issues/scripts/render_issue_forms.py --check

      # The third contributing hook is not gated on the event, because unlike
      # the two below it judges files rather than refs. There is nothing about
      # a decision log that is only true on a pull request: a gap, a duplicate
      # number or a half-written supersession is just as wrong on trunk, and
      # trunk is where somebody pulling finds it. Run with no argument, so the
      # default path is what is judged and a repository with no docs/adr/
      # prints that it has nothing to decide and passes — which is this
      # repository today, and is the branch a consumer with no log takes.
      - name: Check the decision records
        run: python3 contributing/hooks/check-decision-records.py

      # The engineering plugin's nineteen conditions gated every consumer and
      # nothing here, which is how an eight-parameter `_descend` sat in the
      # boundaries hook until somebody ran the gate by hand. A framework that
      # ships a gate and does not stand under it is making a claim it has not
      # tested.
      #
      # The detectors, not their suites. The list is derived rather than
      # written out, so a plugin that adds a detector is covered without this
      # step being remembered. The `test-` prefix is what excludes the
      # suites, and that exclusion is the one engineering/fundamentals/rules/duplication.md
      # asks for in its own words: the `problems_for` and `main` harness is
      # written out in four suites, so condition 1 fires on the third, and
      # collapsing it would need a module shared between plugins — the
      # dependency the no-dependency constraint exists to prevent.
      - name: Check the structure of the hooks
        run: |
          python3 engineering/fundamentals/hooks/check-structure.py \
            $(ls */hooks/*.py */*/hooks/*.py | grep -v '/test-')

      # The remaining two contributing hooks judge a pull request and
      # nothing else.
      #
      # On a push to trunk there is no branch to name — the hook would be
      # handed `main` and would print that it has nothing to decide — and the
      # commits are a rebase's re-authored copies, which carry no signature:
      # contributing/rules/commit-format.md records that 20 of trunk's 24
      # commits fail condition 6 for that reason and that the condition is
      # enforced over a pull request's own commits instead. Running these on
      # push would therefore fail trunk permanently over work nobody can now
      # fix, so they are gated on the event.
      #
      # The two values arrive through the environment rather than being
      # interpolated into the command. A branch name is attacker-controlled on
      # a fork's pull request and `${{ }}` inside `run:` is textual
      # substitution, so a name holding shell metacharacters would execute.
      - name: Check the branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: python3 contributing/hooks/check-branch-name.py "$BRANCH"

      # A fork's pull request can carry its parent's commits: that is what a
      # sync is. They passed the parent's gates when they landed there, and
      # the fork cannot re-sign or re-word them without leaving the parent's
      # history (ADR-010). A fork says so by setting the repository variable
      # PARENT_REPOSITORY to `owner/name`. GitHub's own fork flag is not read,
      # because a repository that syncs through a plain remote never has it.
      # Then the parent's trunk is fetched, and the two checks that read the
      # pull request's commits leave it out. Without the variable nothing is
      # fetched and both run exactly as before.
      - name: Fetch the parent's trunk
        if: github.event_name == 'pull_request' && vars.PARENT_REPOSITORY != ''
        env:
          PARENT_REPOSITORY: ${{ vars.PARENT_REPOSITORY }}
          SERVER: ${{ github.server_url }}
        run: git fetch --no-tags "$SERVER/$PARENT_REPOSITORY.git" "+HEAD:refs/remotes/parent/trunk"

      - name: Check the commits on this pull request
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          exclude=()
          if git rev-parse -q --verify refs/remotes/parent/trunk >/dev/null; then
            exclude=(^refs/remotes/parent/trunk)
          fi
          python3 contributing/hooks/check-commit-message.py "$RANGE" "${exclude[@]}"

      # The forge-tier checks, which read GitHub rather than the tree and so
      # take the default token. Without one they report unchecked, not failed.
      # The payload comes from GITHUB_EVENT_PATH, which Actions sets, so no
      # title, body or branch name is ever interpolated into a command.
      - name: Check the pull request
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 contributing/hooks/check-pull-request.py

      # Also a pull-request check, and run on every one rather than only on a
      # stack, because condition 3 catches a branch carrying commits that
      # already landed, whether or not anything was stacked.
      - name: Check the stack
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 contributing/hooks/check-stack.py

      # The criteria of every issue this pull request closes, read from the
      # issues, against the tests in this checkout. ADR-007.
      - name: Check the trace from criteria to tests
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse -q --verify refs/remotes/parent/trunk >/dev/null; then
            export PARENT_TRUNK=refs/remotes/parent/trunk
          fi
          python3 contributing/hooks/check-traceability.py

      # A plan closes when its units have, and in the order its dependencies
      # say. ADR-011.
      - name: Check the plan
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 contributing/hooks/check-plan.py

      # Not gated on the event: the merge settings and the rulesets are wrong
      # on a pull request exactly when they are wrong on trunk, and a push to
      # trunk is the only event condition 3 has anything to decide on.
      - name: Check trunk
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARENT_REPOSITORY: ${{ vars.PARENT_REPOSITORY }}
        run: python3 contributing/hooks/check-trunk.py
