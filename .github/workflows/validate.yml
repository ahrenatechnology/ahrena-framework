name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  artifacts:
    name: artifact gate (${{ matrix.os }})
    # Two legs, because one class of defect in these hooks is invisible on one
    # of them. `rglob("SKILL.md")` matched a lowercase `skill.md` template and
    # failed the gate on every contributor's Mac while this job stayed green,
    # and no arrangement of files reproduces that on a case-sensitive
    # filesystem — the wrong answer comes from the filesystem, not from the
    # tree. A regression case is therefore only as good as the platform it
    # runs on, so the suites run on both. This repository is public, so the
    # macOS leg is free.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Both actions are pinned past the Node 20 deprecation. The runner
      # already forces Node 24 on them and says so in a warning on every
      # run; these majors target it, so the warning goes and nothing is
      # left running on a version that is scheduled to stop working.
      #
      # The full history is fetched because contributing/hooks/check-commit-
      # message.py walks a revision range. The default shallow clone has one
      # commit and `git rev-list base..head` would be empty on it, which is a
      # gate that passes by seeing nothing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The gate ships with the plugin and takes no dependencies, so CI runs
      # exactly what a consumer runs. No install step, by design.
      # Tests first. A gate whose own tests are not in CI stops being
      # trustworthy the first time somebody edits it in a hurry.
      - name: Test the artifact gate
        run: python3 foundation/hooks/test-validate-artifacts.py

      - name: Test the structure hook
        run: python3 engineering/hooks/test-check-structure.py

      - name: Test the boundaries hook
        run: python3 engineering-python/hooks/test-check-boundaries.py

      - name: Test the typing hook
        run: python3 engineering-python/hooks/test-check-typing.py

      - name: Test the branch-name hook
        run: python3 contributing/hooks/test-check-branch-name.py

      - name: Test the commit-message hook
        run: python3 contributing/hooks/test-check-commit-message.py

      - name: Validate the artifact corpus
        run: python3 foundation/hooks/validate-artifacts.py

      # The engineering plugin's nineteen conditions gated every consumer and
      # nothing here, which is how an eight-parameter `_descend` sat in the
      # boundaries hook until somebody ran the gate by hand. A framework that
      # ships a gate and does not stand under it is making a claim it has not
      # tested.
      #
      # The detectors, not their suites. The list is derived rather than
      # written out, so a plugin that adds a detector is covered without this
      # step being remembered. The `test-` prefix is what excludes the
      # suites, and that exclusion is the one engineering/rules/duplication.md
      # asks for in its own words: the `problems_for` and `main` harness is
      # written out in four suites, so condition 1 fires on the third, and
      # collapsing it would need a module shared between plugins — the
      # dependency the no-dependency constraint exists to prevent.
      - name: Check the structure of the hooks
        run: |
          python3 engineering/hooks/check-structure.py \
            $(ls */hooks/*.py | grep -v '/test-')

      # Both contributing hooks judge a pull request and nothing else.
      #
      # On a push to trunk there is no branch to name — the hook would be
      # handed `main` and would print that it has nothing to decide — and the
      # commits are a rebase's re-authored copies, which carry no signature:
      # contributing/rules/commit-format.md records that 20 of trunk's 24
      # commits fail condition 6 for that reason and that the condition is
      # enforced over a pull request's own commits instead. Running these on
      # push would therefore fail trunk permanently over work nobody can now
      # fix, so they are gated on the event.
      #
      # The two values arrive through the environment rather than being
      # interpolated into the command. A branch name is attacker-controlled on
      # a fork's pull request and `${{ }}` inside `run:` is textual
      # substitution, so a name holding shell metacharacters would execute.
      - name: Check the branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: python3 contributing/hooks/check-branch-name.py "$BRANCH"

      - name: Check the commits on this pull request
        if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: python3 contributing/hooks/check-commit-message.py "$RANGE"
