name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  edges:
    name: artifact graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate declared edges
        run: python3 scripts/validate_edges.py
